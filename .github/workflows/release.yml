name: Release

# 수동 실행 시 macOS 바이너리를 빌드하고 GitHub Release에 첨부.
# 공식 macOS 릴리스는 로컬 Developer ID와 Keychain 공증 프로필을 사용하는
# scripts/release-local-macos.sh가 게시한다. 이 워크플로는 CI signing secrets를
# 별도로 구성한 경우에만 사용하는 명시적 대체 경로다.
# Windows x64도 같은 실행에서 실제 설치/트레이/WebView2 검증을 통과해야
# 공개 릴리스가 생성된다. Universal macOS 바이너리(arm64+x86_64 lipo),
# Windows ZIP, SHA256 체크섬, CHANGELOG 자동 추출 포함.
#
# Actions 탭 → Release → Run workflow에서 이미 존재하는 태그를 입력한다.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.1)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source-preflight:
    name: Validate reviewed release source
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      # Resolve tags with the validator from reviewed main, never from the input tag.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release commit
        id: source
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_REQUIRED: 'true'
        run: node scripts/check-release-source.mjs

  # ── 1. CHANGELOG에서 이번 버전의 릴리즈 노트를 추출 ────────────────────────
  release-notes:
    name: Extract release notes
    needs: source-preflight
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
      version: ${{ needs.source-preflight.outputs.tag }}
      sha: ${{ needs.source-preflight.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-preflight.outputs.sha }}
          persist-credentials: false

      - name: Extract from CHANGELOG.md
        id: extract
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source-preflight.outputs.tag }}
        run: |
          VERSION="$RELEASE_TAG"
          # Strip leading 'v' for CHANGELOG heading match
          VER="${VERSION#v}"
          # Extract the section between ## [VER] and the next ## [
          NOTES=$(awk -v version="$VER" '$1 == "##" && $2 == "[" version "]" {found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Store multiline output using a delimiter absent from the changelog.
          DELIMITER="NOTES_$(openssl rand -hex 16)"
          while [[ "$NOTES" == *"$DELIMITER"* ]]; do
            DELIMITER="NOTES_$(openssl rand -hex 16)"
          done
          {
            echo "notes<<$DELIMITER"
            echo "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  # ── 2. Windows x64: test, install, launch, package ─────────────────────────
  build-windows:
    name: Build and verify Windows x64
    needs: [source-preflight, release-notes]
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ needs.source-preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-preflight.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-x64-v5-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-windows-x64-v5-

      - name: Test workspace
        run: cargo test --locked --workspace --all-features --target x86_64-pc-windows-msvc

      - name: Build release binaries
        run: cargo build --locked --workspace --release --target x86_64-pc-windows-msvc

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $Metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $Version = ($Metadata.packages | Where-Object name -eq "peterfan-menubar").version
          if ("v$Version" -ne $env:RELEASE_TAG) {
            throw "Cargo version v$Version does not match release tag $env:RELEASE_TAG."
          }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package Windows release
        id: package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify packaged install lifecycle
        shell: pwsh
        run: scripts/check-windows-release.ps1 -Archive "${{ steps.package.outputs.archive }}" -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Smoke test unpackaged Windows binaries
        shell: pwsh
        run: scripts/smoke-test-windows.ps1 -BinDir "target\x86_64-pc-windows-msvc\release"

      - name: Upload verified Windows archive
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-x64
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # ── 3. macOS Apple Silicon ─────────────────────────────────────────────────
  build-macos-arm:
    name: Build macOS arm64
    needs: source-preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-preflight.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm-
      - name: Build
        run: cargo build --locked --release --target aarch64-apple-darwin --bins
      - name: Upload arm64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bins-arm64
          path: |
            target/aarch64-apple-darwin/release/peterfan
            target/aarch64-apple-darwin/release/peterfan-tui
            target/aarch64-apple-darwin/release/peterfan-menubar
            target/aarch64-apple-darwin/release/peterfand

  # ── 4. macOS Intel ─────────────────────────────────────────────────────────
  # Cross-compiled from an Apple Silicon runner — macos-13 (Intel-hosted)
  # sat queued with no runner ever picking it up (macos-14 jobs in the same
  # run started within seconds), which silently blocked every release from
  # v1.0.0 onward since `publish` requires this job. Xcode's universal SDK on
  # macos-14 cross-compiles x86_64-apple-darwin fine — there's no need for an
  # actual Intel host.
  build-macos-x86:
    name: Build macOS x86_64
    needs: source-preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-preflight.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-x86-
      - name: Build
        run: cargo build --locked --release --target x86_64-apple-darwin --bins
      - name: Upload x86_64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: bins-x86_64
          path: |
            target/x86_64-apple-darwin/release/peterfan
            target/x86_64-apple-darwin/release/peterfan-tui
            target/x86_64-apple-darwin/release/peterfan-menubar
            target/x86_64-apple-darwin/release/peterfand

  # ── 5. Universal macOS 바이너리 + .app 번들 ───────────────────────────────
  package-macos:
    name: Package macOS Universal
    needs: [source-preflight, release-notes, build-macos-arm, build-macos-x86]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ needs.source-preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.source-preflight.outputs.sha }}
          persist-credentials: false

      - name: Download arm64
        uses: actions/download-artifact@v8
        with:
          name: bins-arm64
          path: bins/arm64

      - name: Download x86_64
        uses: actions/download-artifact@v8
        with:
          name: bins-x86_64
          path: bins/x86_64

      - name: Import Developer ID signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]]; then
            echo "No Developer ID certificate secret configured; macOS assets will be ad-hoc signed."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/peterfan-signing.keychain-db"
          KEYCHAIN_PASSWORD="${MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="${MACOS_SIGN_IDENTITY:-$(security find-identity -p codesigning -v "$KEYCHAIN_PATH" | awk -F\" '/Developer ID Application/ {print $2; exit}')}"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: no Developer ID Application identity found in imported certificate." >&2
            security find-identity -p codesigning -v "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi
          echo "Using signing identity: $IDENTITY"
          echo "PETERFAN_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Create Universal binaries (lipo)
        run: |
          mkdir -p bins/universal
          for bin in peterfan peterfan-tui peterfan-menubar peterfand; do
            lipo -create \
              "bins/arm64/$bin" \
              "bins/x86_64/$bin" \
              -output "bins/universal/$bin"
            chmod +x "bins/universal/$bin"
          done

      - name: Assemble archive
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          VER="${VERSION#v}"
          NAME="peterfan-${VERSION}-universal-apple-darwin"
          mkdir -p "dist/$NAME"
          cp bins/universal/* "dist/$NAME/"
          cp README.md LICENSE CHANGELOG.md "dist/$NAME/"
          # Sign loose CLI binaries too. In official releases this uses
          # Developer ID; in forks/local release builds it falls back to ad-hoc.
          for bin in peterfan peterfan-tui peterfan-menubar peterfand; do
            scripts/sign-macos.sh "dist/$NAME/$bin"
          done
          # .app bundle (bundle-macos.sh signs it internally)
          VERSION="${VER}" bash scripts/bundle-macos.sh \
            "bins/universal/peterfan-menubar" "dist/$NAME"
          tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Build .dmg (drag-to-Applications installer, no Terminal needed)
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          NAME="peterfan-${VERSION}-universal-apple-darwin"
          bash scripts/make-dmg.sh "dist/$NAME/PeterFan.app" "dist/PeterFan-${VERSION}.dmg"

      - name: Notarize macOS .dmg
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          VERSION="$RELEASE_TAG"
          DMG="dist/PeterFan-${VERSION}.dmg"

          if [[ -z "${PETERFAN_SIGN_IDENTITY:-}" ]]; then
            echo "No Developer ID signing identity; skipping notarization."
            exit 0
          fi
          if [[ -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER_ID}" || -z "${APPLE_API_KEY_B64}" ]]; then
            echo "No App Store Connect API key secrets; skipping notarization."
            exit 0
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
          APPLE_API_KEY_PATH="$KEY_PATH" scripts/notarize-macos.sh "$DMG"

      - name: Keep only verified macOS .dmg
        shell: bash
        run: |
          DMG=$(find dist -maxdepth 1 -name 'PeterFan-*.dmg' -print -quit)
          if [[ -z "$DMG" ]]; then
            exit 0
          fi
          if scripts/check-macos-release.sh --artifact-only "$DMG"; then
            echo "Verified distributable DMG: $DMG"
          else
            echo "DMG is not a verified notarized release artifact; removing it so GitHub Release does not publish a broken installer." >&2
            rm -f "$DMG"
          fi

      - name: Upload macOS universal archive
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-universal
          path: ${{ env.ASSET }}

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-dmg
          path: dist/PeterFan-*.dmg
          if-no-files-found: ignore

  # ── 6. 검증된 macOS + Windows 자산으로 GitHub Release 생성 ────────────────
  publish:
    name: Publish GitHub Release
    needs: [release-notes, package-macos, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ needs.release-notes.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-notes.outputs.version }}
      RELEASE_SHA: ${{ needs.release-notes.outputs.sha }}
    steps:
      # No selected-source checkout or repository scripts run with the write token.
      - name: Confirm release tag still points to the verified commit
        shell: bash
        run: |
          ACTUAL_SHA="$(gh api "repos/$GH_REPO/commits/tags/$RELEASE_TAG" --jq .sha)"
          if [[ "$ACTUAL_SHA" != "$RELEASE_SHA" ]]; then
            echo "error: release tag moved after preflight; refusing publication." >&2
            exit 1
          fi

      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          if [[ "${GITHUB_REPOSITORY}" == "uulab-official/peterfan" ]]; then
            dmg_files=(PeterFan-*.dmg)
            if [[ "${#dmg_files[@]}" == "0" ]]; then
              echo "error: official PeterFan releases must include a verified notarized DMG." >&2
              exit 1
            fi
          fi
          release_files=(*.tar.gz *.zip *.dmg)
          if [[ "${#release_files[@]}" == "0" ]]; then
            echo "error: no release files were downloaded." >&2
            exit 1
          fi
          sha256sum "${release_files[@]}" | sort -k2 | tee checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-notes.outputs.version }}
          name: "PeterFan ${{ needs.release-notes.outputs.version }}"
          body: ${{ needs.release-notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(needs.release-notes.outputs.version, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/checksums.txt
          fail_on_unmatched_files: false
