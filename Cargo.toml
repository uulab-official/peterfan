[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/platform",
    "packages/cli",
    "packages/tui",
    "packages/menubar",
    "packages/daemon",
]
# Standalone dev tools, not part of the product build.
exclude = ["tools/icongen"]

[workspace.package]
version = "1.32.11"
edition = "2021"
license = "MIT"
authors = ["UULab"]
repository = "https://github.com/uulab-official/peterfan"
rust-version = "1.88"

[workspace.dependencies]
peterfan-core = { path = "packages/core" }
peterfan-platform = { path = "packages/platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
crossterm = "0.28"
libc = "0.2"
sysinfo = "0.36"
# Maintained drop-in fork of rust-battery. The abandoned 0.7.x crate keeps an
# old Linux-only nix dependency with RUSTSEC-2021-0119 in Cargo.lock.
battery = { package = "starship-battery", version = "=0.10.2" }
# Keep the reviewed macOS 27 backport selected until the patch is removed.
tray-icon = "=0.24.1"
tao = "0.35"
macsmc = "0.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
toml = "0.8"
dirs = "7"

[patch.crates-io]
# Official macOS 27 click fix backported without raising the Rust 1.88 MSRV.
tray-icon = { path = "vendor/tray-icon-0.24.1" }

[profile.release]
lto = "thin"
strip = true
