[workspace]
resolver = "2"
members = [
    "packages/core",
    "packages/platform",
    "packages/cli",
    "packages/tui",
    "packages/menubar",
    "packages/daemon",
]
# Standalone dev tools, not part of the product build.
exclude = ["tools/icongen"]

[workspace.package]
version = "1.27.61"
edition = "2021"
license = "MIT"
authors = ["PeterFan contributors"]
repository = "https://github.com/uulab-official/peterfan"
rust-version = "1.80"

[workspace.dependencies]
peterfan-core = { path = "packages/core" }
peterfan-platform = { path = "packages/platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
sysinfo = "0.36"
# Maintained drop-in fork of rust-battery. The abandoned 0.7.x crate keeps an
# old Linux-only nix dependency with RUSTSEC-2021-0119 in Cargo.lock.
battery = { package = "starship-battery", version = "=0.10.2" }
tray-icon = "0.24"
tao = "0.35"
macsmc = "0.1"
core-foundation = "0.10"
core-foundation-sys = "0.8"
toml = "0.8"
dirs = "6"

[profile.release]
lto = "thin"
strip = true
