[package]
name = "peterfan-menubar"
description = "PeterFan menu-bar app: live system metrics in the macOS menu bar (Windows tray)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "peterfan-menubar"
path = "src/main.rs"

[dependencies]
peterfan-core = { workspace = true }
peterfan-platform = { workspace = true }
tray-icon = { workspace = true }
tao = { workspace = true }
wry = "0.55.1"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
png = "0.18.1"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAccessibility", "NSAppearance", "NSBitmapImageRep", "NSButton", "NSColor", "NSGraphics", "NSFont", "NSFontDescriptor", "objc2-core-foundation", "NSImage", "NSImageRep", "NSEvent", "NSScreen", "NSStatusItem", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CATransaction", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDate", "NSGeometry", "NSRunLoop", "NSString", "NSTimer", "block2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage"] }
