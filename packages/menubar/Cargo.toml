[package]
name = "peterfan-menubar"
description = "PeterFan menu-bar app: live system metrics in the macOS menu bar (Windows tray)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "peterfan-menubar"
path = "src/main.rs"

[dependencies]
peterfan-core = { workspace = true }
peterfan-platform = { workspace = true }
tray-icon = { workspace = true }
tao = { workspace = true }
wry = "0.55.1"
serde_json = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSImage", "NSEvent", "NSScreen", "NSStatusItem", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
png = "0.18.1"
