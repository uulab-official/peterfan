<style>
#cpu-widget-setting{display:block;}#cpu-widget-setting[hidden]{display:none;}
.cpu-widget-heading,.cpu-widget-options,.cpu-widget-preview-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.cpu-widget-heading{margin-bottom:10px;}.cpu-widget-heading .settings-item-copy{display:block;font-size:10px;margin-top:3px;max-width:230px;line-height:1.45;}
.cpu-widget-options{flex-wrap:wrap;gap:9px;font-size:10px;color:var(--dim);}
.cpu-widget-options label,.cpu-widget-on{display:flex;align-items:center;gap:6px;}
.cpu-widget-options select{max-width:136px;min-width:0;padding:5px 23px 5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--chip-bg);color:var(--text);font:inherit;color-scheme:inherit;}
.cpu-widget-options input,.cpu-widget-on input{accent-color:var(--accent);width:15px;height:15px;margin:0;}
.cpu-widget-options :focus-visible,.cpu-widget-on input:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.cpu-widget-on{flex-shrink:0;font-size:10px;color:var(--dim);}
.cpu-widget-preview-row{margin-top:11px;min-height:28px;}.cpu-widget-preview{display:flex;align-items:center;justify-content:center;gap:5px;height:28px;min-width:104px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--chip-bg);color:var(--text);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;}
.cpu-widget-preview svg{display:block;width:32px;height:18px;max-width:100%;overflow:hidden;flex-shrink:1;}.cpu-widget-preview{min-width:0;max-width:65%;}.cpu-widget-preview-number{flex-shrink:0;}.cpu-widget-core-help{font-size:10px;line-height:1.5;color:var(--dim);margin-top:8px;}.cpu-widget-preview-number{min-width:4ch;text-align:right;white-space:pre;}
.cpu-widget-preview[data-style=number] svg,.cpu-widget-preview[data-style=number] .cpu-preview-bar,.cpu-widget-preview[data-style=history] .cpu-preview-bar,.cpu-widget-preview[data-style=bar] .cpu-preview-history,.cpu-widget-preview[data-style=bar] .cpu-preview-grid{display:none;}
.cpu-widget-preview:not([data-style=cores]) .cpu-preview-core,.cpu-widget-preview[data-style=cores] .cpu-preview-bar,.cpu-widget-preview[data-style=cores] .cpu-preview-history,.cpu-widget-preview[data-style=cores] .cpu-preview-grid{display:none;}
#cpu-widget-status{font-size:10px;line-height:1.4;color:var(--dim);text-align:right;max-width:190px;overflow-wrap:anywhere;}
</style>
<div class="settings-item" id="cpu-widget-setting" hidden>
<div class="cpu-widget-heading"><div><div class="settings-item-title" id="cpu-widget-title">CPU widget appearance</div><div class="settings-item-copy" id="cpu-widget-copy">Style and percentage preferences are kept while hidden.</div></div></div>
<div class="cpu-widget-options"><label for="cpu-widget-style"><span id="cpu-widget-style-label">Display</span><select id="cpu-widget-style" disabled onchange="setCpuWidget('style',this.value)"><option id="cpu-widget-style-bar" value="bar">Bar</option><option id="cpu-widget-style-cores" value="cores">Per-core bars</option><option id="cpu-widget-style-history" value="history">History</option><option id="cpu-widget-style-number" value="number">Number</option></select></label><label><input id="cpu-widget-percentage" type="checkbox" checked disabled onchange="setCpuWidget('show_percentage',this.checked)"><span id="cpu-widget-percent-label">Show percentage</span></label></div>
<div class="cpu-widget-preview-row"><div class="cpu-widget-preview" id="cpu-widget-preview" data-style="bar" aria-label="CPU menu bar preview"><svg id="cpu-widget-preview-svg" viewBox="0 0 64 36" aria-hidden="true"><path class="cpu-preview-grid" d="M2 3H62M2 18H62M2 32H62" stroke="currentColor" stroke-opacity=".2" fill="none"/><rect class="cpu-preview-bar" x="4" y="9" width="56" height="18" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2"/><rect class="cpu-preview-bar" id="cpu-widget-preview-bar" x="6" y="11" width="0" height="14" fill="currentColor"/><path class="cpu-preview-bar" id="cpu-widget-preview-missing" d="M28 18H36" stroke="currentColor" stroke-width="2"/><path class="cpu-preview-history" id="cpu-widget-preview-graph" d="" stroke="currentColor" fill="none" stroke-width="1"/><path class="cpu-preview-core" id="cpu-widget-core-tracks" stroke="currentColor" stroke-opacity=".2" fill="none" stroke-width="6"/><path class="cpu-preview-core" id="cpu-widget-core-load" stroke="currentColor" fill="none" stroke-width="6"/><path class="cpu-preview-core" id="cpu-widget-core-missing" stroke="currentColor" fill="none" stroke-width="2"/></svg><span class="cpu-widget-preview-number" id="cpu-widget-preview-number">--%</span></div><div id="cpu-widget-status" role="status" aria-live="polite"></div></div>
<div class="cpu-widget-core-help" id="cpu-widget-core-help" hidden></div>
</div>
